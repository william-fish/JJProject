<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>道具卡像素图标预览</title>
    <style>
        body { background-color: #222; color: #fff; font-family: sans-serif; display: flex; gap: 20px; padding: 40px; }
        .card { background: #333; border: 4px solid #fff; padding: 15px; text-align: center; width: 100px; border-radius: 8px; }
        .title { font-size: 14px; margin-top: 10px; font-weight: bold; }
        
        /* 纯CSS像素画绘制示例 */
        .pixel-art { width: 64px; height: 64px; margin: 0 auto; position: relative; image-rendering: pixelated; }
        
        /* 1号：牛魔王（牛角像素阵列） */
        .bull-king {
            background: transparent;
            box-shadow: 
                16px 8px #8b5a2b, 44px 8px #8b5a2b,
                16px 12px #8b5a2b, 44px 12px #8b5a2b,
                20px 16px #8b5a2b, 40px 16px #8b5a2b,
                24px 20px #ff4500, 36px 20px #ff4500,
                24px 24px #333, 28px 24px #ff4500, 32px 24px #ff4500, 36px 24px #ff4500,
                20px 28px #ff4500, 40px 28px #ff4500;
        }

        /* 52号：风险骰子（红白像素骰子） */
        .dice {
            background: #fff;
            border: 4px solid #000;
            box-shadow: 
                16px 16px #ff0000, 20px 16px #ff0000,
                16px 20px #ff0000, 20px 20px #ff0000;
        }

        /* 5号：纯爱战士（像素爱心） */
        .pure-love {
            background: transparent;
            box-shadow: 
                16px 12px #ff69b4, 24px 12px #ff69b4, 40px 12px #ff69b4, 48px 12px #ff69b4,
                12px 16px #ff69b4, 28px 16px #ff69b4, 36px 16px #ff69b4, 52px 16px #ff69b4,
                12px 20px #ff69b4, 52px 20px #ff69b4,
                16px 24px #ff69b4, 48px 24px #ff69b4,
                20px 28px #ff69b4, 44px 28px #ff69b4,
                24px 32px #ff69b4, 40px 32px #ff69b4,
                28px 36px #ff69b4, 36px 36px #ff69b4,
                32px 40px #ff69b4;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="pixel-art bull-king"></div>
        <div class="title">牛魔王</div>
    </div>

    <div class="card">
        <div class="pixel-art pure-love"></div>
        <div class="title">纯爱战士</div>
    </div>

    <div class="card">
        <div class="pixel-art dice" style="width: 40px; height: 40px;"></div>
        <div class="title">风险骰子</div>
    </div>

</body>
</html>
